# =============================================================
# Redpanda — Lightweight Kafka-compatible Streaming Bus
# =============================================================
# Single-node Redpanda for local development.
# Exposes Kafka API on port 19092 (external) / 9092 (internal).
# =============================================================

version: "3.8"

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: clinical-ai-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --set=redpanda.enable_idempotence=true
      - --set=redpanda.auto_create_topics_enabled=true
    ports:
      - "19092:19092"    # Kafka API (external)
      - "9644:9644"      # Admin API (health checks)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Redpanda Console UI for debugging topics
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: clinical-ai-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    restart: unless-stopped

volumes:
  redpanda-data:
